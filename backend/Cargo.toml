[package]
name = "nas-picture-manager-axum"
version = "0.1.16"
edition = "2021"
autotests = false

[dependencies]
axum = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["fs"] }
http-body-util = "0.1"

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "controllers"
path = "tests/integration/controllers.rs"

[[test]]
name = "routes"
path = "tests/integration/routes.rs"

[[test]]
name = "main"
path = "tests/integration/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
